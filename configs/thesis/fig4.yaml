# Thesis Fig. 4: uncertainty principle, aliasing and sampling density (thesis PDF p. 57).  [D11]
# From the figure: N = 32, Gaussian kernel sigma = 0.29, spacings d = 1, 3, 5, 8, 16 with T = floor(N/d) samples at
# c_t = t d 2pi/N (T = 32, 10, 6, 4, 2), and its printed values E_alias = 0, 0.250, 0.447, 0.571, 0.707 and
# r_eff = 25, 10, 6, 4, 2; uncertainty products: point 2.45, Gabor 1.38, box 2.00, Gaussian (med, wide) 0.50.
N: 32
kernel: {family: gaussian, sigma: 0.29}
spacings: [1, 3, 5, 8, 16]
decay: 0.1                 # ridge lambda (D10 units; a_0 of a unit-integral kernel is (N/2pi)^2 = 26)
rank_eps: 0.01             # tolerance for r_eff (eq. 5.4); not printed in the thesis
target: {kind: gaussian_psd, beta: 0.05}   # smooth target on the 32-neuron ring
seed: 4
figure_E_alias: [0.000, 0.250, 0.447, 0.571, 0.707]
figure_r_eff: [25, 10, 6, 4, 2]
up_N: 512                  # finer ring for the uncertainty panel (reduces discretization)
up_families:               # label -> [family, params, figure product]
  Point: [gaussian, {sigma: 0.025}, 2.45]
  Gabor: [gabor, {sigma: 0.29, xi0: 8.0}, 1.38]
  Box: [box, {R: 1.2}, 2.00]
  Gaussian med: [gaussian, {sigma: 0.29}, 0.50]
  Gaussian wide: [gaussian, {sigma: 1.0}, 0.50]
