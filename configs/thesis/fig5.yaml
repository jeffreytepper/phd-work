# Thesis Fig. 5: per-mode error decomposition (thesis PDF p. 71).  [D11]
# Inferred from the figure:
#  * N = 128 (N/2 = 64 marked), T = 32 (T/2 = 16 marked), Gaussian target S(m) = exp(-m^2 / 50) (S drops to 1e-7 at m ~ 28).
#  * Panels E/F: kernels "matched" sigma = 0.08, "narrow" 0.015, "wide" 0.8 at EQUAL spectral energy, with
#    lambda = 1e-3 * a_0(matched): the matched kernel factor is ~1e-6 at m = 0, the narrow one ~ 2.5e-5 (flat),
#    which is what equal energy predicts.  Printed sums: matched 1.46e-5, narrow 1.66e-4, wide 2.79.
#  * Panel C: E_network for the Gaussian PSD and a polynomial PSD s = 1.5 (reference N^-2); the printed values
#    (2.4 at N = 8 for the Gaussian, 2.5e-2 for the polynomial) are one-sided sums over m > N/2.
N: 128
T: 32
S_width2: 50.0                     # S(m) = exp(-m^2 / S_width2)
kernels: {matched: 0.08, narrow: 0.015, wide: 0.8}
lambda_rel: 1.0e-3                 # lambda / a_0(matched kernel)
panelA_kernel: matched
noise_levels: [0.01, 0.1]          # sigma_eta^2 for panel B (target normalized as in panel D, S(0) = 1)
network_N: [8, 16, 32, 64, 128, 256, 512]
poly_s: 1.5
figure_F_sums: {matched: 1.46e-5, narrow: 1.66e-4, wide: 2.79}
