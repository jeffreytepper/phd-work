[project]
name = "seqnet"
version = "0.1.0"
description = "From readout function to sequence connectivity: Braun et al. (2026) reproduction and sequence networks (thesis framework lives in msc-thesis)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["nbformat>=5", "nbconvert>=7", "nbclient>=0.10", "ipykernel>=6", "jupyterlab>=4", "ipywidgets>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seqnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
